<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Anna Tourtoura · Project Manager</title>
  <!--@head-->
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <!--@fonts-->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;700;800&display=swap" rel="stylesheet">
  <!--@/fonts-->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="sheet">

    <nav class="topbar" aria-label="Main">
      <a class="topbar__name" href="#top"><!--@fullName--></a>
      <div class="topbar__links">
        <a href="#experience">Experience</a>
        <a href="#education">Education</a>
        <a href="#contact">Contact</a>
      </div>
    </nav>

    <header class="hero" id="top">
      <h1 class="hero__title"><span><!--@firstName--></span>.</h1>
      <span class="pill"><!--@tag--></span>
      <svg class="asterisk" viewBox="0 0 100 100" aria-hidden="true">
        <g fill="currentColor">
          <rect x="41" y="0" width="18" height="100"/>
          <rect x="41" y="0" width="18" height="100" transform="rotate(60 50 50)"/>
          <rect x="41" y="0" width="18" height="100" transform="rotate(-60 50 50)"/>
        </g>
      </svg>
    </header>

    <section class="highlights" aria-label="Highlights" id="highlights"><!--@highlights--></section>

    <div class="grid">
      <main class="col col--main">
        <section class="block" id="experience">
          <h2>Experience</h2>
          <div id="experience-list"><!--@experience--></div>
          <h3 class="subhead">Earlier career</h3>
          <ul class="earlier" id="earlier-list"><!--@earlier--></ul>
        </section>

        <section class="block" id="education">
          <h2>Education</h2>
          <div id="education-list"><!--@education--></div>
        </section>
      </main>

      <aside class="col col--side">
        <figure class="portrait" id="portrait"><!--@portrait--></figure>
        <p class="bigname" id="bigname"><!--@bigname--></p>

        <section class="block block--tight" id="profile">
          <h2>Profile</h2>
          <div id="profile-text"><!--@profile--></div>
        </section>

        <section class="block block--tight" id="contact">
          <h2>Contact</h2>
          <div class="contact" id="contact-links"><!--@contact--></div>
        </section>

        <div class="split">
          <section class="block block--tight">
            <h2>Languages</h2>
            <ul class="dots" id="languages-list"><!--@languages--></ul>
          </section>
          <section class="block block--tight">
            <h2>Certifications</h2>
            <ul class="dots" id="cert-list"><!--@certifications--></ul>
          </section>
        </div>

        <section class="block block--tight">
          <h2>Skills</h2>
          <ul class="dots dots--two" id="skills-list"><!--@skills--></ul>
        </section>
      </aside>
    </div>

    <footer class="footer">
      <span id="footer-text"><!--@footer--></span>
      <a href="#top">Back to top ↑</a>
    </footer>

  </div>

  <!--@scripts-->
  <script src="content.js"></script>
  <script src="render.js"></script>
  <script src="script.js"></script>
  <!--@/scripts-->
</body>
</html>
